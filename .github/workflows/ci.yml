name: CI

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    name: TypeScript & Worker
    runs-on: ubuntu-24.04
    steps:
      - uses: so1ve/workflows/setup-js@v1
        with:
          node-version: "24"
      - run: pnpm run cf-typegen
      - run: pnpm run check
      - run: pnpm exec wrangler deploy --dry-run
